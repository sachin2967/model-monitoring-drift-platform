services:
  drift-api:
    build: .
    command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      DRIFT_API_KEY: ${DRIFT_API_KEY:-}
      DRIFT_STATE_PATH: /app/state/reports.sqlite3
      FRAUD_REFERENCE_PATH: ${FRAUD_REFERENCE_PATH:-}
      FRAUD_REFERENCE_SHA256: ${FRAUD_REFERENCE_SHA256:-}
    volumes:
      - drift-state:/app/state
      - ${DRIFT_REFERENCE_DIR:-./reference}:/app/reference:ro
    ports:
      - "127.0.0.1:${DRIFT_API_PORT:-8030}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  drift-dashboard:
    build: .
    environment:
      DRIFT_API_URL: http://drift-api:8000
      DRIFT_API_KEY: ${DRIFT_API_KEY:-}
    command: ["streamlit", "run", "streamlit_app/app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "127.0.0.1:${DRIFT_DASHBOARD_PORT:-8530}:8501"
    depends_on:
      drift-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  drift-state:
